app:
  host: 127.0.0.1
  port: 8888
  reconcile_interval: 5m
  request_timeout: 15s
  sync_concurrency: 4

targets:
  - id: target-newapi-main
    name: New API Target
    type: newapi
    base_url: https://newapi-target.example.com
    # Root/admin console access token, not a model API key.
    access_token: REPLACE_WITH_NEW_API_TARGET_ADMIN_ACCESS_TOKEN
    # Numeric dashboard user ID for legacy sessions; omit when using a PAT.
    user_id: 1

  - id: target-cpa-main
    name: CLIProxyAPI Target
    type: cliproxyapi
    base_url: https://cpa-target.example.com
    management_key: REPLACE_WITH_CPA_TARGET_MANAGEMENT_KEY

upstreams:
  - id: upstream-newapi-main
    name: New API Source
    type: newapi
    base_url: https://newapi-source.example.com
    # Ordinary-user dashboard PAT; SyncHub reads only this user's tokens.
    access_token: REPLACE_WITH_NEW_API_SOURCE_USER_ACCESS_TOKEN
    # Numeric dashboard user ID for legacy sessions; omit when using a PAT.
    user_id: 1
    sync_mappings: []

  - id: upstream-generic-main
    name: OpenAI-Compatible Source
    type: generic
    base_url: https://provider.example.com
    # Each key is an independent model source; no upstream login is used.
    keys:
      - id: primary
        name: Primary Key
        api_key: REPLACE_WITH_PRIMARY_MODEL_API_KEY
        enabled: true
      - id: backup
        name: Backup Key
        api_key: REPLACE_WITH_BACKUP_MODEL_API_KEY
        enabled: false
        # Optional fallback when this endpoint cannot list its own models.
        models:
          - gpt-5.6-sol
    sync_mappings: []
