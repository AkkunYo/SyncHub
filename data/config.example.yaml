app:
  host: 127.0.0.1
  port: 8888
  reconcile_interval: 5m
  request_timeout: 15s
  sync_concurrency: 4

targets:
  - id: target-newapi-main
    name: New API Target
    type: newapi
    base_url: https://newapi-target.example.com
    # Root/admin console access token, not a model API key.
    access_token: REPLACE_WITH_NEW_API_TARGET_ADMIN_ACCESS_TOKEN
    # Numeric dashboard user ID for legacy sessions; omit when using a PAT.
    user_id: 1

  - id: target-cpa-main
    name: CLIProxyAPI Target
    type: cliproxyapi
    base_url: https://cpa-target.example.com
    management_key: REPLACE_WITH_CPA_TARGET_MANAGEMENT_KEY

upstreams:
  - id: upstream-newapi-main
    name: New API Source
    type: newapi
    base_url: https://newapi-source.example.com
    # Root/admin console access token, not a model API key.
    access_token: REPLACE_WITH_NEW_API_SOURCE_ADMIN_ACCESS_TOKEN
    # Numeric dashboard user ID for legacy sessions; omit when using a PAT.
    user_id: 1
    sync_mappings: []

  - id: upstream-cpa-main
    name: CLIProxyAPI Source
    type: cliproxyapi
    base_url: https://cpa-source.example.com
    management_key: REPLACE_WITH_CPA_SOURCE_MANAGEMENT_KEY
    # Optional key accepted by the CPA proxy endpoint for model requests.
    proxy_api_key: REPLACE_WITH_CPA_PROXY_API_KEY
    sync_mappings: []

  - id: upstream-sub2api-main
    name: Sub2Api Source
    type: sub2api
    base_url: https://sub2api-source.example.com
    api_key: REPLACE_WITH_SUB2API_ADMIN_API_KEY
    sync_mappings: []
