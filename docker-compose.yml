services:
  sync-hub:
    build:
      context: .
      args:
        VERSION: ${VERSION:-docker-local}
        COMMIT: ${COMMIT:-local}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    image: synchub:local
    user: "0:0"
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - synchub_data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8888/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  synchub_data:
